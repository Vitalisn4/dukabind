name: link-health

# Guard against silent model-URL rot: if the pinned GGUF URL dies between
# submission and audit, judges cannot fetch the weights (a pipeline DQ).
# Runs weekly + on demand; fails loudly on a dead or non-200 final response.

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gguf-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract pinned GGUF URL
        id: extract
        run: |
          URL="$(
            awk -F'"' '
              /^[[:space:]]*MODEL_URL="/ { value = $2; count++ }
              END {
                if (count != 1) exit 1
                print value
              }
            ' download_model.sh
          )" || {
            echo "::error::expected exactly one MODEL_URL assignment in download_model.sh"
            exit 1
          }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Checking: $URL"

      - name: Verify GGUF URL is reachable and non-empty
        env:
          EXTRACTED_URL: ${{ steps.extract.outputs.url }}
        run: |
          URL="$EXTRACTED_URL"
          if [[ -z "$URL" ]]; then
            echo "::error::no .gguf URL found in download_model.sh"
            exit 1
          fi
          HTTP=$(curl -sSIL -o /dev/null -w '%{http_code}' --max-time 60 "$URL")
          SIZE=$(curl -sSIL --max-time 60 "$URL" | awk 'tolower($1)=="content-length:" {print $2}' | tr -d '\r' | tail -1)
          echo "HTTP $HTTP, content-length: ${SIZE:-unknown}"
          if [[ "$HTTP" != "200" ]]; then
            echo "::error::GGUF URL returned HTTP $HTTP (expected 200). The model download will fail for judges"
            exit 1
          fi
          if [[ ! "$SIZE" =~ ^[0-9]+$ ]] || (( SIZE < 1000000000 )); then
            echo "::error::GGUF content-length '${SIZE:-missing}' is not a valid size ≥ 1 GB. Possibly a stub page, not the model"
            exit 1
          fi
          echo "OK: GGUF URL is alive"
