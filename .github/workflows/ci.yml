name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (pytest)
        run: PYTHONPATH=. pytest tests/ -q

      - name: Lint (ruff)
        run: ruff check app tests evals scripts

      - name: Static analysis gate (ruff + bandit + shellcheck)
        run: bash scripts/static_analysis.sh

      - name: Held-out eval (T11 bind/refuse)
        run: PYTHONPATH=. python evals/run_heldout.py

      - name: Held-out report freshness
        run: |
          PYTHONPATH=. python evals/run_heldout.py --write-report /tmp/report.generated.md
          # The Generated-date line legitimately changes daily; strip it from
          # both copies so the comparison covers only the evidence content.
          sed '/^\*\*Generated:/d' evals/heldout/REPORT.md > /tmp/report.committed.md
          sed '/^\*\*Generated:/d' /tmp/report.generated.md > /tmp/report.normalized.md
          diff -u /tmp/report.committed.md /tmp/report.normalized.md || {
            echo "::error::evals/heldout/REPORT.md is stale — rerun 'PYTHONPATH=. python evals/run_heldout.py --write-report' and commit the regenerated file"
            exit 1
          }

      - name: Offline binder proof (no model)
        run: bash scripts/offline_check.sh

      # Contest-claims drift is caught by tests/test_metadata.py under pytest.
