name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (pytest)
        run: PYTHONPATH=. pytest tests/ -q

      - name: Lint (ruff)
        run: ruff check app tests evals scripts

      - name: Static analysis gate (ruff + bandit + shellcheck)
        run: bash scripts/static_analysis.sh

      - name: Held-out eval (T11 bind/refuse)
        run: PYTHONPATH=. python evals/run_heldout.py

      - name: Offline binder proof (no model)
        run: bash scripts/offline_check.sh

      # Contest-claims drift is caught by tests/test_metadata.py under pytest.
